name: Build image with fresh yt-dlp

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_IMAGE: ghcr.io/aizhimou/pigeon-pod:latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/pigeon-pod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest yt-dlp version from PyPI
        id: ytdlp
        run: |
          v=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "Latest yt-dlp: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Match upstream platforms
        id: platforms
        run: |
          p=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[]?.platform | select(.os=="linux") | "\(.os)/\(.architecture)\(if .variant then "/"+.variant else "" end)"] | unique | join(",")')
          [ -z "$p" ] && p="linux/amd64"
          echo "Building for: $p"
          echo "list=$p" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # Build amd64 locally first and check it actually runs before publishing.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          platforms: linux/amd64
          build-args: |
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: smoke-test:local

      - name: Smoke test
        run: |
          got=$(docker run --rm --entrypoint yt-dlp smoke-test:local --version)
          echo "yt-dlp in image: $got"
          [ "$got" = "${{ steps.ytdlp.outputs.version }}" ]
          docker run --rm --entrypoint sh smoke-test:local -c 'java -version && ffmpeg -version | head -1'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          build-args: |
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:ytdlp-${{ steps.ytdlp.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PigeonPod with an up-to-date yt-dlp
            io.github.ytdlp.version=${{ steps.ytdlp.outputs.version }}
