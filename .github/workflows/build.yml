name: Build image with fresh yt-dlp

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write
  actions: write   # lets the keepalive job re-enable this workflow

env:
  UPSTREAM_IMAGE: ghcr.io/aizhimou/pigeon-pod:latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/pigeon-pod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest yt-dlp version from PyPI
        id: ytdlp
        run: |
          v=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "Latest yt-dlp: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Match upstream platforms
        id: platforms
        run: |
          p=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[]?.platform | select(.os=="linux") | "\(.os)/\(.architecture)\(if .variant then "/"+.variant else "" end)"] | unique | join(",")')
          [ -z "$p" ] && p="linux/amd64"
          echo "Building for: $p"
          echo "list=$p" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # Build amd64 locally first and check it actually runs before publishing.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          platforms: linux/amd64
          build-args: |
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: smoke-test:local

      - name: Smoke test
        id: smoke
        run: |
          got=$(docker run --rm --entrypoint yt-dlp smoke-test:local --version)
          want="${{ steps.ytdlp.outputs.version }}"
          echo "yt-dlp in image: $got (PyPI: $want)"
          # PyPI drops leading zeros (2026.8.19); yt-dlp prints 2026.08.19
          norm() { echo "$1" | awk -F. '{for(i=1;i<=NF;i++){$i=$i+0}}1' OFS=.; }
          if [ "$(norm "$got")" != "$(norm "$want")" ]; then
            echo "::error::Expected yt-dlp $want but image has $got"; exit 1
          fi
          docker run --rm --entrypoint sh smoke-test:local -c 'java -version 2>&1 | head -1 && ffmpeg -version | head -1'
          echo "version=$got" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          build-args: |
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:ytdlp-${{ steps.smoke.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PigeonPod with an up-to-date yt-dlp
            io.github.ytdlp.version=${{ steps.smoke.outputs.version }}

  # GitHub pauses scheduled workflows in public repos after 60 days without
  # commits. Re-enabling the workflow via the API resets that timer, so the
  # weekly build keeps running with no dummy commits. Separate job so it runs
  # even if the build fails.
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Reset inactivity timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
